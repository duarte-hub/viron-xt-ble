# AstralPool Viron P320C XT pump over BLE.
# Protocol notes: https://github.com/duarte-hub/viron-xt-ble/blob/main/NOTES.md
#
# Needs four entries in secrets.yaml (see secrets.yaml.example):
#   wifi_ssid, wifi_password
#   pump_mac          - first flash: leave it as "00:00:00:00:00:00", watch the log for a
#                       "pump_finder" line, put the address it prints here, flash again.
#   pump_access_code  - 4 characters the pump broadcasts for ~100 s after a mains
#                       power-cycle; read it with tools/probe.py watch.

esphome:
  name: pool-pump
  friendly_name: Pool pump

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://duarte-hub/viron-xt-ble
    components: [viron_pump]
  # Working on the component locally? Use this instead:
  # - source:
  #     type: local
  #     path: ../components

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  on_ble_advertise:
    - then:
        # Logs the pump's MAC (and its access code while the pairing window is open).
        # Matches on the manufacturer data (company 0x0447, device type 0 = pump)
        # rather than the name, which only arrives in the scan response.
        - lambda: |-
            static uint32_t last_log = 0;
            for (auto &m : x.get_manufacturer_datas()) {
              if (!(m.uuid == esp32_ble_tracker::ESPBTUUID::from_uint16(0x0447)) || m.data.size() < 23 || m.data[0] != 0)
                continue;
              if (millis() - last_log < 10000)
                return;
              last_log = millis();
              ESP_LOGI("pump_finder", "Pump found at %s (RSSI %d)", x.address_str().c_str(), x.get_rssi());
              if (m.data[19] != 0) {
                ESP_LOGI("pump_finder", "  access code: %c%c%c%c", m.data[19], m.data[20], m.data[21], m.data[22]);
              }
            }

ble_client:
  - mac_address: !secret pump_mac
    id: pump_ble

viron_pump:
  id: pump
  ble_client_id: pump_ble
  access_code: !secret pump_access_code
  update_interval: 2s  # must stay well under the pump's 10 s idle timeout

binary_sensor:
  - platform: template
    name: Connected
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(pump).is_authenticated();
  - platform: template
    name: Priming
    lambda: |-
      if (!id(pump).has_state()) return {};
      return id(pump).priming();

sensor:
  - platform: template
    name: Target speed
    unit_of_measurement: rpm
    icon: mdi:fan
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 2s
    lambda: |-
      if (!id(pump).has_state()) return {};
      return id(pump).target_rpm();
  - platform: template
    name: Power
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 5s
    lambda: |-
      if (!id(pump).has_telemetry()) return {};
      return id(pump).power_w();

switch:
  - platform: template
    name: Run
    icon: mdi:pump
    # Never replay a saved state at boot: that would stop or start the pump
    # every time the ESP32 restarts.
    restore_mode: DISABLED
    lambda: |-
      if (!id(pump).has_state()) return {};
      return id(pump).running();
    turn_on_action:
      - lambda: id(pump).start();
    turn_off_action:
      - lambda: id(pump).stop();

select:
  - platform: template
    name: Speed
    options: [Low, Medium, High]
    update_interval: 2s
    lambda: |-
      static const char *const NAMES[] = {"Low", "Medium", "High"};
      if (!id(pump).has_state() || id(pump).speed() > 2) return {};
      return std::string(NAMES[id(pump).speed()]);
    set_action:
      - lambda: |-
          if (x == "Low") id(pump).select_speed(0);
          else if (x == "Medium") id(pump).select_speed(1);
          else if (x == "High") id(pump).select_speed(2);

# These rewrite the presets stored in the pump. Fine for occasional changes;
# avoid driving them from a fast automation.
number:
  - platform: template
    name: Low speed
    unit_of_measurement: rpm
    entity_category: config
    mode: box
    min_value: 600
    max_value: 3450
    step: 25
    update_interval: 5s
    lambda: |-
      if (!id(pump).has_setup()) return {};
      return id(pump).preset_rpm(0);
    set_action:
      - lambda: id(pump).set_preset_rpm(0, x);
  - platform: template
    name: Medium speed
    unit_of_measurement: rpm
    entity_category: config
    mode: box
    min_value: 600
    max_value: 3450
    step: 25
    update_interval: 5s
    lambda: |-
      if (!id(pump).has_setup()) return {};
      return id(pump).preset_rpm(1);
    set_action:
      - lambda: id(pump).set_preset_rpm(1, x);
  - platform: template
    name: High speed
    unit_of_measurement: rpm
    entity_category: config
    mode: box
    min_value: 600
    max_value: 3450
    step: 25
    update_interval: 5s
    lambda: |-
      if (!id(pump).has_setup()) return {};
      return id(pump).preset_rpm(2);
    set_action:
      - lambda: id(pump).set_preset_rpm(2, x);
